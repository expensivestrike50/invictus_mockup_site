<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">Augustus multilingual voice chat on desktop and mobile</title><desc id="desc">Transparent glass-style desktop and mobile application interfaces showing a live AI voice conversation translated between Spanish, Arabic and French.</desc>
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dcecff" stop-opacity=".52"/></linearGradient>
 <linearGradient id="glassDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#194784" stop-opacity=".9"/><stop offset="1" stop-color="#071d43" stop-opacity=".96"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#258cf4"/><stop offset="1" stop-color="#3154d8"/></linearGradient>
 <linearGradient id="wave" x1="0" x2="1"><stop stop-color="#42a5ff"/><stop offset=".5" stop-color="#6c78f4"/><stop offset="1" stop-color="#23c5dd"/></linearGradient>
 <radialGradient id="orb1"><stop stop-color="#4eb8ff" stop-opacity=".48"/><stop offset="1" stop-color="#4eb8ff" stop-opacity="0"/></radialGradient><radialGradient id="orb2"><stop stop-color="#7b8fff" stop-opacity=".34"/><stop offset="1" stop-color="#7b8fff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#153969" flood-opacity=".26"/></filter><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a5a8f" flood-opacity=".18"/></filter>
 <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#071d43}.b{font-weight:700}.muted{fill:#55708f}.xs{font-size:12px}.sm{font-size:14px}.md{font-size:16px}.white{fill:#fff}.line{stroke:#c5d9ee;stroke-opacity:.75}</style>
</defs>
<!-- transparent canvas -->
<circle cx="1315" cy="190" r="330" fill="url(#orb1)"/><circle cx="330" cy="745" r="430" fill="url(#orb2)"/><path d="M64 680C350 389 472 161 780 145c297-15 487 140 755 10" fill="none" stroke="#9acfff" stroke-opacity=".28" stroke-width="2"/>

<!-- desktop device -->
<g filter="url(#shadow)"><rect x="95" y="115" width="1090" height="700" rx="34" fill="url(#glass)" stroke="#fff" stroke-width="2"/></g><rect x="117" y="137" width="1046" height="656" rx="25" fill="#f8fbff" fill-opacity=".42"/>
<rect x="117" y="137" width="220" height="656" rx="25" fill="#fff" fill-opacity=".54"/><text x="151" y="183" class="t b" font-size="29">Augustus</text><text x="151" y="210" class="muted sm">Voice workspace</text>
<g class="t sm"><rect x="138" y="247" width="178" height="48" rx="13" fill="url(#blue)"/><path d="M157 263q0-8 8-8t8 8v7q0 8-8 8t-8-8zm-5 7q0 13 13 13t13-13m-13 13v6m-8 0h16" fill="none" stroke="#fff" stroke-width="2"/><text x="197" y="277" class="white b">Voice chat</text>
<g transform="translate(147 318)"><circle cx="19" cy="19" r="19" fill="#e8f3ff"/><path d="M8 14q0-7 8-7h6q8 0 8 7v5q0 7-8 7h-5l-8 5 2-7q-3-2-3-5z" fill="none" stroke="#123f7e" stroke-width="2"/><text x="55" y="24">Messages</text><circle cx="164" cy="5" r="10" fill="#258cf4"/><text x="164" y="9" text-anchor="middle" class="white xs">5</text></g>
<g transform="translate(147 382)"><circle cx="19" cy="19" r="19" fill="#edf0ff"/><path d="M8 10h22v18H8zm5-5v7m12-7v7M8 16h22" fill="none" stroke="#123f7e" stroke-width="2"/><text x="55" y="24">Meetings</text></g><g transform="translate(147 446)"><circle cx="19" cy="19" r="19" fill="#e9f7ff"/><path d="M9 9h20v20H9zm5 5h10m-10 5h10m-10 5h6" fill="none" stroke="#123f7e" stroke-width="2"/><text x="55" y="24">Transcripts</text></g><g transform="translate(147 510)"><circle cx="19" cy="19" r="19" fill="#eef5ff"/><path d="M9 27v-8h5v8m5 0V11h5v16m5 0V6h5v21" fill="none" stroke="#123f7e" stroke-width="2"/><text x="55" y="24">Insights</text></g></g>
<path d="M143 699h167" class="line"/><circle cx="165" cy="746" r="21" fill="url(#blue)"/><text x="165" y="752" text-anchor="middle" class="white b sm">AM</text><text x="200" y="741" class="t b sm">Alex Morgan</text><text x="200" y="760" class="muted xs">Online</text>

<!-- desktop main -->
<text x="375" y="178" class="t b" font-size="25">Live multilingual conversation</text><circle cx="379" cy="205" r="5" fill="#218ef1"/><text x="391" y="210" class="muted sm">AI interpretation active</text><rect x="934" y="158" width="203" height="43" rx="21" fill="#fff" fill-opacity=".76"/><path d="M954 177h17m-4-6 6 6-6 6m-17 0-6 6 6 6" fill="none" stroke="#123f7e" stroke-width="1.7"/><text x="984" y="184" class="t sm">Auto-translate</text><circle cx="1114" cy="180" r="12" fill="#258cf4"/><circle cx="1118" cy="180" r="8" fill="#fff"/>

<!-- participants -->
<rect x="368" y="232" width="769" height="80" rx="20" fill="#fff" fill-opacity=".65"/><g><circle cx="407" cy="272" r="24" fill="#3154d8"/><text x="407" y="278" text-anchor="middle" class="white b sm">AM</text><text x="444" y="263" class="t b sm">Alex</text><text x="444" y="283" class="muted xs">English</text><circle cx="571" cy="272" r="24" fill="#258cf4"/><text x="571" y="278" text-anchor="middle" class="white b sm">CR</text><text x="608" y="263" class="t b sm">Carlos Ruiz</text><text x="608" y="283" class="muted xs">Español</text><circle cx="755" cy="272" r="24" fill="#194784"/><text x="755" y="278" text-anchor="middle" class="white b sm">LN</text><text x="792" y="263" class="t b sm">Léa Noir</text><text x="792" y="283" class="muted xs">Français</text><circle cx="927" cy="272" r="24" fill="#4a68c6"/><text x="927" y="278" text-anchor="middle" class="white b sm">عم</text><text x="964" y="263" class="t b sm">عمر منصور</text><text x="964" y="283" class="muted xs">العربية</text></g>

<!-- transcript -->
<rect x="368" y="329" width="769" height="342" rx="22" fill="#fff" fill-opacity=".68"/><text x="393" y="363" class="t b md">Live transcript</text><rect x="975" y="346" width="137" height="32" rx="16" fill="#eaf4ff"/><circle cx="995" cy="362" r="5" fill="#258cf4"/><text x="1007" y="367" class="muted xs">Recording 04:18</text>
<g><circle cx="408" cy="410" r="20" fill="#258cf4"/><text x="408" y="415" text-anchor="middle" class="white b xs">CR</text><rect x="442" y="388" width="513" height="60" rx="16" fill="#eaf4ff"/><text x="461" y="413" class="t sm">“Necesitamos un extremo que pueda jugar por ambas bandas.”</text><text x="461" y="435" class="muted xs">We need a winger who can play on both sides. · Spanish → English</text><rect x="974" y="400" width="71" height="25" rx="12" fill="#fff"/><text x="1009" y="417" text-anchor="middle" class="muted xs">ES → EN</text></g>
<g><circle cx="408" cy="490" r="20" fill="#194784"/><text x="408" y="495" text-anchor="middle" class="white b xs">LN</text><rect x="442" y="468" width="513" height="60" rx="16" fill="#f0f2ff"/><text x="461" y="493" class="t sm">« Le budget est flexible si le profil correspond au système. »</text><text x="461" y="515" class="muted xs">The budget is flexible if the profile suits the system. · French → English</text><rect x="974" y="480" width="71" height="25" rx="12" fill="#fff"/><text x="1009" y="497" text-anchor="middle" class="muted xs">FR → EN</text></g>
<g><circle cx="408" cy="570" r="20" fill="#4a68c6"/><text x="408" y="575" text-anchor="middle" class="white b xs">عم</text><rect x="442" y="548" width="513" height="60" rx="16" fill="#edf5ff"/><text x="934" y="573" text-anchor="end" class="t sm" direction="rtl">« نفضّل لاعباً شاباً يتمتع بسرعة عالية وقدرة على الضغط. »</text><text x="461" y="595" class="muted xs">We prefer a young player with pace and pressing ability. · Arabic → English</text><rect x="974" y="560" width="71" height="25" rx="12" fill="#fff"/><text x="1009" y="577" text-anchor="middle" class="muted xs">AR → EN</text></g>
<path d="M392 630h720" class="line"/><text x="393" y="654" class="muted xs">AI summary updates automatically as participants speak.</text>

<!-- desktop voice controls -->
<rect x="368" y="690" width="769" height="78" rx="22" fill="url(#glassDark)"/><g fill="#75c1ff"><rect x="410" y="723" width="4" height="12" rx="2"/><rect x="420" y="714" width="4" height="30" rx="2"/><rect x="430" y="707" width="4" height="44" rx="2"/><rect x="440" y="717" width="4" height="24" rx="2"/><rect x="450" y="710" width="4" height="38" rx="2"/><rect x="460" y="720" width="4" height="18" rx="2"/><rect x="470" y="712" width="4" height="34" rx="2"/><rect x="480" y="724" width="4" height="10" rx="2"/></g><text x="504" y="725" class="white b sm">Listening to Alex...</text><text x="504" y="746" fill="#bfdcff" font-family="Arial" font-size="12">English · live translation enabled</text><circle cx="883" cy="729" r="24" fill="#fff" fill-opacity=".14"/><path d="M875 725q0-9 8-9t8 9v5q0 9-8 9t-8-9zm-6 5q0 14 14 14t14-14m-14 14v7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="947" cy="729" r="24" fill="#fff" fill-opacity=".14"/><path d="M938 721h18v14h-18zm18 4 9-6v20l-9-6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="1011" cy="729" r="24" fill="#ed4f67"/><path d="M1001 729h20" stroke="#fff" stroke-width="3"/><text x="1052" y="734" class="white b sm">End call</text>

<!-- mobile device -->
<g filter="url(#shadow)"><rect x="1177" y="195" width="330" height="650" rx="48" fill="#0b2147"/><rect x="1188" y="207" width="308" height="626" rx="39" fill="url(#glass)" stroke="#fff" stroke-opacity=".8"/></g><rect x="1293" y="218" width="96" height="23" rx="12" fill="#0b2147"/>
<text x="1215" y="272" class="t b" font-size="22">Augustus</text><circle cx="1457" cy="265" r="18" fill="#fff" fill-opacity=".76"/><path d="M1450 270v-7q0-7 7-7t7 7v7z" fill="none" stroke="#123f7e" stroke-width="1.7"/>
<text x="1215" y="315" class="t b md">Voice room</text><text x="1215" y="337" class="muted xs">4 participants · translating live</text>
<rect x="1214" y="355" width="256" height="102" rx="22" fill="url(#blue)"/><text x="1342" y="383" text-anchor="middle" class="white b sm">Carlos is speaking</text><g fill="#fff"><rect x="1274" y="405" width="4" height="18" rx="2"/><rect x="1285" y="393" width="4" height="42" rx="2"/><rect x="1296" y="400" width="4" height="28" rx="2"/><rect x="1307" y="387" width="4" height="54" rx="2"/><rect x="1318" y="397" width="4" height="34" rx="2"/><rect x="1329" y="404" width="4" height="20" rx="2"/><rect x="1340" y="391" width="4" height="46" rx="2"/><rect x="1351" y="401" width="4" height="26" rx="2"/><rect x="1362" y="395" width="4" height="38" rx="2"/><rect x="1373" y="405" width="4" height="18" rx="2"/><rect x="1384" y="399" width="4" height="30" rx="2"/><rect x="1395" y="390" width="4" height="48" rx="2"/><rect x="1406" y="402" width="4" height="24" rx="2"/></g><text x="1342" y="447" text-anchor="middle" fill="#dcecff" font-family="Arial" font-size="11">Español → English</text>
<text x="1215" y="492" class="muted xs">LIVE CAPTION</text><rect x="1214" y="506" width="256" height="106" rx="19" fill="#fff" fill-opacity=".75"/><text x="1233" y="535" class="t sm">We need a winger who can</text><text x="1233" y="557" class="t sm">play on both sides and arrive</text><text x="1233" y="579" class="t sm">before the window closes.</text><rect x="1233" y="588" width="65" height="17" rx="8" fill="#e8f3ff"/><text x="1265" y="600" text-anchor="middle" class="muted" font-size="10">ES → EN</text>
<text x="1215" y="647" class="muted xs">LANGUAGES</text><g class="t xs"><rect x="1214" y="660" width="77" height="33" rx="16" fill="#fff" fill-opacity=".76"/><text x="1252" y="681" text-anchor="middle">ES Spanish</text><rect x="1299" y="660" width="77" height="33" rx="16" fill="#fff" fill-opacity=".76"/><text x="1337" y="681" text-anchor="middle">FR French</text><rect x="1384" y="660" width="86" height="33" rx="16" fill="#fff" fill-opacity=".76"/><text x="1427" y="681" text-anchor="middle">AR العربية</text></g>
<circle cx="1261" cy="756" r="28" fill="#fff" fill-opacity=".82"/><path d="M1252 751q0-10 9-10t9 10v6q0 10-9 10t-9-10zm-6 6q0 15 15 15t15-15" fill="none" stroke="#123f7e" stroke-width="2"/><circle cx="1342" cy="756" r="35" fill="url(#blue)"/><path d="M1331 750q0-12 11-12t11 12v7q0 12-11 12t-11-12zm-7 7q0 18 18 18t18-18m-18 18v8" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="1423" cy="756" r="28" fill="#ef5368"/><path d="M1412 756h22" stroke="#fff" stroke-width="3"/><text x="1342" y="811" text-anchor="middle" class="muted xs">Tap to mute</text>
</svg>
